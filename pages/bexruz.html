<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
           <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-clifford: #da373d;
      }
    </style>
    <title>Document</title>
</head>
<body>
    <header>
        <div class="container m-auto px-[20px] py-[20px]">
            <div class="flex gap-[200px]">
                <img src="./images/Logo.png" alt="">
                <div class="flex gap-[100px]">
                    <a class="text-[#363A45] text-[14px] leading-[150%]" href="./Amirshox.html">Доска объявлений</a>
                    <a class="text-[#363A45] text-[14px] leading-[150%]" href="./pages/Amirshox.html">Сервисный центр</a>
                    <a class="text-[#363A45] text-[14px] leading-[150%]" href="./pages/Dily.html">Интернет-магазин Dily.ru</a>
                    <a class="text-[#363A45] text-[14px] leading-[150%]" href="./pages/Sкупка.html">Скупка</a>
                    <img src="./images/меню.png" alt="" >
                </div>
            </div>
        </div>
    </header>
    <section class="bg-gray-100 min-h-screen py-10">
  <div class="max-w-4xl mx-auto px-4">

   
    <h1 class="text-4xl font-bold text-gray-800 mb-8">
      Оформление заказа
    </h1>

    
    <div class="bg-white rounded-xl shadow p-6 mb-8">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-semibold text-lg">Состав заказа</h2>
        <a href="#" class="text-gray-400 text-sm hover:text-green-500">
          Изменить
        </a>
      </div>

      <div class="flex justify-between font-bold text-xl mb-4">
        <span>Смартфон Apple Iphone 12 mini 64 GB Green 1</span>
        <span>77 000 ₽</span>
      </div>

      <div class="flex justify-between font-bold text-xl">
        <span>Всего</span>
        <span>77 990 ₽</span>
      </div>
    </div>

    
    <div class="bg-white rounded-xl shadow p-6 mb-8">
      <h2 class="font-semibold text-lg mb-5">
        Способ получения в Москве
      </h2>

      <div class="flex gap-4 mb-6">
        <button class="bg-green-500 text-white px-8 py-3 rounded-lg">
          Доставка
        </button>

        <button class="bg-gray-100 px-8 py-3 rounded-lg text-gray-600">
          Самовывоз
        </button>
      </div>

      <div class="bg-gray-50 p-6 rounded-lg">

        <label class="block mb-2 text-sm font-medium">
          Город доставки
        </label>

        

        <div class="grid md:grid-cols-2 gap-4 mb-5">

          <div>
            <label class="block mb-2 text-sm font-medium">
              Дата
            </label>

            <select class="w-full border rounded-lg p-3">
              
            </select>
          </div>

          <div>
           
              Время
            </label>

            <select class="w-full border rounded-lg p-3">      
            </select>
          </div>

        </div>

        <div class="grid md:grid-cols-2 gap-4 mb-5">

          <div>
            <label class="block mb-2 text-sm font-medium">
              Улица корпус дом
            </label>

            <input
              
              
              class="w-full border rounded-lg p-3"
            >
          </div>
 

          <div>
            <label class="block mb-2 text-sm font-medium">
              Квартира 
            </label>
            <input
              type="text"
              class="w-full border rounded-lg p-3">            
          </div>
        </div>





        <input
          type="text"        
          class="w-full border rounded-lg p-3">       
      </div>
    </div>


    <button
      class="bg-green-500 hover:bg-green-600 text-white px-10 py-3 rounded-lg mb-8">
      Далее
    </button>
<!-- //////////////////////////////////////////////////////////////////////////////////////////////// -->
   
    <div class="bg-white rounded-xl shadow p-6">

      <h2 class="font-semibold text-lg mb-6">
        Способ оплаты
      </h2>

      <div class="grid md:grid-cols-2 gap-4">

        <label
          class="border rounded-xl p-4 cursor-pointer">
          <div class="flex items-center gap-3">        
            <span class="font-medium">Онлайн</span>
          </div>

         
        </label>

        <label
          class="border rounded-xl p-4 cursor-pointer">
          <div class="flex items-center gap-3">          
            <span class="font-medium">Рассрочка онлайн</span>
          </div>

          
        </label>

        <label
          class="border rounded-xl p-4 cursor-pointer">
          <div class="flex items-center gap-3">            
            <span class="font-medium">При получении</span>
          </div>

        </label>

        <label
          class="border rounded-xl p-4 cursor-pointer">
          <div class="flex items-center gap-3">
            <span class="font-medium">Электронными деньгами</span>
          </div>

          
        </label>

      </div>

      <button
        class="mt-8 bg-green-500 hover:bg-green-600 text-white px-10 py-3 rounded-lg">
        Далее
      </button>

    </div>

  </div>
</section>
<!-- ////////////////////////////////////////////////////////////////////////////////////////////////////////// -->
 <!-- RECIPIENT INFORMATION -->
<section class="bg-[#f5f5f5] py-12">
  <div class="max-w-5xl mx-auto px-6">

    <div class="bg-white rounded-2xl shadow-sm p-8">

      <h2 class="text-3xl font-bold text-gray-800 mb-8">
        Данные получателя
      </h2>

      <form class="grid md:grid-cols-2 gap-6">

        
        <div>
          <label class="block text-lg font-medium text-gray-700 mb-2">
            Имя
          </label>

          <input
            type="text"         
            class="w-full h-14 px-4 border border-gray-300 rounded-xl outline-none focus:border-green-500">        
        </div>

       
        <div>
          <label class="block text-lg font-medium text-gray-700 mb-2">
            Фамилия
          </label>

          <input
            type="text"            
            class="w-full h-14 px-4 border border-gray-300 rounded-xl outline-none focus:border-green-500">          
        </div>

        <div>
          <label class="block text-lg font-medium text-gray-700 mb-2">
            Телефон
          </label>


          <input
            type="tel"
            class="w-full h-14 px-4 border border-gray-300 rounded-xl outline-none focus:border-green-500">          
        </div>

        
        <div>
          <label class="block text-lg font-medium text-gray-700 mb-2">
            E-mail
          </label>

          <input
            type="email"          
            class="w-full h-14 px-4 border border-gray-300 rounded-xl outline-none focus:border-green-500">         
        </div>
      </form>
    </div>

    
    <div class="flex flex-col md:flex-row items-center justify-between gap-6 mt-8">
      <button
        class="bg-green-500 hover:bg-green-600 text-white font-medium px-16 py-4 rounded-xl transition">
        Оформить заказ
      </button>
    </div>

  </div>
</section>
</body>
</html>
